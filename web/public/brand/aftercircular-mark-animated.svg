<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="AfterCircular">
  <style>
    .ac-trace { stroke-dasharray: 14 100; stroke-dashoffset: 14; animation: ac-travel 5s cubic-bezier(.6,.05,.4,1) infinite; }
    .ac-node { transform-origin: 51.66px 45.77px; animation: ac-pulse 5s ease-in-out infinite; }
    @keyframes ac-travel {
      0%   { stroke-dashoffset: 14; opacity: 0; }
      6%   { opacity: 1; }
      62%  { stroke-dashoffset: -100; opacity: 1; }
      66%  { stroke-dashoffset: -100; opacity: 0; }
      100% { stroke-dashoffset: -100; opacity: 0; }
    }
    @keyframes ac-pulse {
      0%, 60%  { transform: scale(1); }
      68%      { transform: scale(1.3); }
      78%,100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ac-trace, .ac-node { animation: none; }
      .ac-trace { opacity: 0; }
    }
  </style>
  <path d="M44 52.78A24 24 0 1 1 55.64 36.17" stroke="#222222" stroke-width="5" stroke-linecap="round"/>
  <path class="ac-trace" pathLength="100" d="M44 52.78A24 24 0 1 1 55.64 36.17" stroke="#AD314D" stroke-width="5" stroke-linecap="round"/>
  <circle class="ac-node" cx="51.66" cy="45.77" r="4.25" fill="#AD314D"/>
  <path d="M20 52.78L32 14L44 52.78M24.57 38H39.43" stroke="#222222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
