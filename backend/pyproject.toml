[project]
name = "aftercircular-backend"
version = "0.1.0"
description = "AfterCircular regulatory-intelligence pipeline (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.50",
    "azure-search-documents>=11.6",
    "azure-identity>=1.17",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typesafe-sdk>=0.7.0",
    "toon-format==0.9.0b1",
    "tiktoken>=0.14.0",
    "azure-monitor-opentelemetry>=1.8.10",
    "aiohttp>=3.14.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "types-PyYAML"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# third-party: starlette's TestClient still references a deprecated anyio alias (not our code)
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]
