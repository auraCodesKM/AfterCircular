    category: sop
    topics: [derivatives-operations, limit-monitoring, expiry, physical-settlement, margin-calls]
    regulator_topics: [derivatives, settlement, margins]
  - id: PRIV-001
    path: legal/PRIV-001-client-data-privacy-policy.md
    title: Client Data Privacy Policy
    category: legal
    topics: [privacy, data-retention, consent, data-sharing]
    regulator_topics: [data-protection, record-keeping]

exclude:
  - .github/**
  - CHANGELOG.md
