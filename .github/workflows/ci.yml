name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      # the suite never touches Azure, Foundry, SEBI or GitHub: conftest clears those endpoints and uses the stub provider
      - run: uv run pytest -q
      - run: uv run mypy app scripts evals

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  images:
    # build both images exactly as Azure will, so a broken Dockerfile fails CI rather than a deployment
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: aftercircular-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          load: true
          tags: aftercircular-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: API container answers its liveness probe
        run: |
          docker run -d --name api -p 8000:8000 -e ENVIRONMENT=dev -e AI_PROVIDER=stub -e BACKEND_API_KEY=ci aftercircular-api:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf localhost:8000/health/live && break; sleep 2; done
          curl -sf localhost:8000/health/ready
          docker rm -f api
