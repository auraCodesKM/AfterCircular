# Production-like local run: the same two images that go to Azure Container Apps, talking to the real Microsoft Foundry,
# Azure AI Search, SEBI and GitHub with the credentials in backend/.env and web/.env.local.
#
#   docker compose up --build        start (add -d to detach)
#   docker compose logs -f api       follow one service
#   docker compose down              stop (add -v to drop the local database volume)
#
# Persistence: ./backend/data is bind-mounted at /data, so the SQLite database survives `down`. Run as your own uid so
# the container may write it: `AC_UID=$(id -u) AC_GID=$(id -g) docker compose up`. In Azure this path is an Azure Files
# share instead (see DEPLOYMENT.md) — never container-local storage.
services:
  api:
    build: ./backend
    image: aftercircular-api:local
    user: "${AC_UID:-10001}:${AC_GID:-10001}"
    env_file: [./backend/.env]
    environment:
      DATABASE_PATH: /data/aftercircular.db
      PORT: "8000"
      CORS_ORIGINS: http://localhost:3000
      # the database lives on a mounted share (bind mount here, Azure Files in ACA): SQLite's WAL needs shared memory
      # the share cannot provide, so use the rollback journal
      SQLITE_JOURNAL_MODE: DELETE
      ENVIRONMENT: ${ENVIRONMENT:-demo}
      # Entra ID inside a container cannot use the host's `az login` (no CLI in the image). Locally, export a dev
      # service principal before `docker compose up` — in Azure the container app uses its managed identity and needs none.
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
    volumes:
      - ./backend/data:/data
    ports: ["8010:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./web
    image: aftercircular-web:local
    env_file: [./web/.env.local]
    environment:
      # service-to-service inside the compose network; the browser never talks to the API directly
      BACKEND_URL: http://api:8000
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      PORT: "3000"
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
